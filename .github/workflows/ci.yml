# Independent verification for every pull request and every push to main.
#
# It exists because for PRs #28-#33 there was no workflow file at all: the
# "453 tests passed" line in a PR description was a local run reported by its
# author, and a reviewer had no way to tell a real green suite from a typo. A
# check on the commit is the difference.
#
# WHAT THIS DELIBERATELY DOES NOT RUN. The suite below is hermetic and $0 —
# every Fly touchpoint is injected, and nothing reaches a network anyone bills
# for. The one server it does talk to is a Postgres **service container**: free
# on a runner, thrown away with the job, holding nothing. That distinction is
# the line, not "no sockets" — the recipes that reach real infrastructure must
# never run here, because they cost money and need credentials that do not
# belong in CI.
#
#   just fly-up / fly-cycle / fly-proof / fly-doctor / fly-auth / fly-secrets
#   just e2e-live                        the above, plus real model tokens
#
# Nothing here reads `.env` either (gitignored; holds an OpenRouter key and the
# box's dashboard password). `just check` runs clean in a tree without one —
# keep it that way, and no secret is ever needed by this workflow.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it interrupts; don't pay for the old one.
# main is excluded from cancellation so every commit on it keeps its verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: python (ruff + pytest + postgres)
    runs-on: ubuntu-latest

    # The store runs on SQLite or Postgres, and one claim about it cannot be
    # checked on SQLite: that the Postgres dialect's
    # `LOCK TABLE … IN SHARE ROW EXCLUSIVE MODE` makes the concurrency cap's
    # count-then-insert atomic. SQLite gets that from `BEGIN IMMEDIATE`;
    # Postgres's `BEGIN` is optimistic, so two sessions can both read a count of
    # zero and both insert.
    #
    # Only a race can tell whether the lock is doing its job, and until now the
    # race only ran when somebody remembered `just test-postgres` on a laptop.
    # Three of those tests skipped on every PR — and a skip reports as a pass,
    # which is the same failure #36 found in `test_app.py`.
    #
    # `postgres:16-alpine` matches what `just test-postgres` starts locally, so
    # the two places these run cannot disagree about the server.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Every `uv run` inside the justfile resolves against the committed
      # lockfile and refuses to silently update it, so a pyproject.toml change
      # without a matching `uv lock` fails here instead of drifting.
      UV_FROZEN: "1"
      # Read at *import* by `test_store_postgres.py` and by `test_store.py`'s
      # engine list, which is why the autouse fixture stripping every `FLOTTA_*`
      # variable per test does not take it away. `conftest.pytest_sessionstart`
      # refuses to run at all if this is missing while `$CI` is set, so this
      # line going away is a red check rather than a quiet return to skipping.
      FLOTTA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - name: Install uv (and Python 3.11)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # requires-python is >=3.11; test the floor, which is also what the
          # project's own .venv runs.
          python-version: "3.11"
          enable-cache: true

      # CI runs the same recipe a developer runs locally rather than a copy of
      # its body, so `just check` cannot change without CI following it.
      - name: Install just
        uses: extractions/setup-just@v4

      - run: uv sync --frozen

      - name: just check (ruff check src + pytest)
        run: just check

  dashboard:
    name: dashboard (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # From dashboard/.nvmrc, so nvm/fnm and CI cannot disagree about the
          # version the lockfile is maintained under. next 16 needs >=20.9.
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # `just check-dashboard` runs `npm install` when node_modules is absent,
      # which is right for a laptop and wrong here: CI must install exactly the
      # committed lockfile. Hence `npm ci` and the two commands inline rather
      # than the recipe. Keep the tsc/eslint pair in step with that recipe.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx eslint .

  app:
    name: app (tsc + vitest + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Tauri links against the system webview, so the Rust half does not
      # compile on a bare runner. These are Tauri's own documented Linux
      # dependencies; without them `cargo clippy` fails to find webkit2gtk and
      # the failure reads like a broken lockfile rather than a missing library.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Inline rather than `just check-app`, for the same reason the dashboard
      # job is: the recipe runs `npm ci` only when node_modules is absent,
      # which is right on a laptop and wrong here. Keep these in step with it.
      - run: npm ci
        working-directory: app

      - run: npx tsc --noEmit
        working-directory: app

      - run: npm test
        working-directory: app

      - run: cargo fmt --check
        working-directory: app/src-tauri

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri

      - run: cargo test
        working-directory: app/src-tauri
