[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["Flotta"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The three reasons this is a desktop app rather than a page.
#
# `reqwest` — every request to the control plane and to a box is made from
# here, not from the webview. Requests from Rust are not subject to CORS, so
# the door needs no cross-origin headers, and the token never has to be handed
# to JavaScript to make a call.
#
# `keyring` — the token lives in the OS keychain. A file in the repo would be
# committed eventually and `localStorage` is readable by anything that gets
# script execution in the webview.
# `cookies` because Hermes's login hands back a session cookie and the
# ws-ticket call needs it — the box's auth is a login *form*, not a header.
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
    "cookies",
], default-features = false }

# The agent socket. The reply to a prompt arrives as an *event* on this socket,
# not as the response to the submit, so nothing here can be modelled as a
# request/response pair.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

