[project]
name = "flotta"
version = "0.0.1"
description = "Open-source fleet runtime for self-improving agents"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
# Deliberately small. `modal` was here as the runtime's client and left with
# the shard tier; Fly is driven through `flyctl` as a subprocess, so it adds no
# dependency at all. Hermes itself is image-only — it runs *on* a box, never in
# this package.
dependencies = [
    "typer>=0.12",
    # The box's agent surface is a WebSocket; this is the client for it.
    # Declared explicitly rather than relied on transitively — it used to
    # arrive via modal, which was never a promise and is now not even true.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Postgres is opt-in. The fleet store defaults to a SQLite file so local work
# and the whole test suite need no server — installing a database driver to run
# 455 hermetic tests would be a poor trade. `uv sync --extra postgres` adds it
# for anyone pointing $FLOTTA_DATABASE_URL at a real server.
postgres = ["psycopg[binary]>=3.1"]
# The control plane's HTTP surface, for anyone *running* the service:
# `uv sync --extra control`. Its test dependencies are in the `dev` group
# instead — see the note there; keeping them only here made 16 tests vanish
# from CI while it still reported green.
control = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn>=0.34",
]
# Everything, for a deployment that runs the control plane against Postgres.
server = ["flotta[postgres,control]"]

[project.scripts]
flotta = "flotta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    # The control plane's test dependencies live here, NOT only in the
    # `control` extra. They were extra-only, `test_app.py` guarded itself with
    # `pytest.importorskip("fastapi")`, and CI runs a plain `uv sync --frozen`
    # — so the whole file was skipped, and a skip reports as a pass. Sixteen
    # tests were invisible on every PR: the bind guard, the health-503 check,
    # the cost-sum regression, and the store-resolution check. CI was green the
    # entire time.
    #
    # This is the same failure the postgres transaction guards had — a green
    # signal measuring nothing — so the fix is to make the deps unavoidable
    # rather than to add the extra to one CI job. A contributor running
    # `uv sync && just check` gets the same coverage CI does.
    #
    # `uvicorn` stays extra-only: only `serve()` needs it, and that is an
    # entrypoint with no test.
    "fastapi>=0.115",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flotta"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
