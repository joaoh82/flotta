[project]
name = "flotta-langgraph"
version = "0.1.0"
description = "Run a LangGraph agent on Flotta: serve(graph)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "flotta-agent>=0.1.0",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "langchain-openai>=0.3"]

[tool.uv.sources]
flotta-agent = { path = "../flotta-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flotta_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
