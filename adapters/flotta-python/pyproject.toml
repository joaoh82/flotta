[project]
name = "flotta-agent"
version = "0.1.0"
description = "Run your own Python agent on Flotta: the box contract, served."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flotta_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
